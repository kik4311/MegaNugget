name: MegaNugget checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux SDK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwayland-dev libdbus-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets -- -D warnings
      - run: npm ci
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: npm run format:check
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm audit --audit-level=high
        working-directory: apps/desktop
      - name: Compile native desktop (no signing, no bundle)
        run: npm run tauri build -- --no-bundle
        working-directory: apps/desktop
  desktop-qt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Qt 6 and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            qt6-base-dev qt6-base-dev-tools
      - run: cargo build -p apply-channel --locked
      - run: |
          cmake -S apps/desktop-qt -B apps/desktop-qt/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++
          cmake --build apps/desktop-qt/build
          ctest --test-dir apps/desktop-qt/build --output-on-failure
      - name: Smoke (binary resolves apply-channel)
        run: |
          cp target/debug/apply-channel apps/desktop-qt/build/
          test -x apps/desktop-qt/build/meganugget-desktop-qt
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: swift test
        working-directory: apps/ios
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/ios
      - name: Compile SwiftUI for simulator (not hardware validation)
        run: xcodebuild -project MegaNugget.xcodeproj -scheme MegaNugget -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/ios
      - name: Build unsigned ARM64 device app (not installable)
        run: >-
          xcodebuild -project MegaNugget.xcodeproj -scheme MegaNugget
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
        working-directory: apps/ios
      - name: Package unsigned IPA and provenance
        run: python3 scripts/package_unsigned_ios.py apps/ios/build/device/Build/Products/Release-iphoneos/MegaNugget.app artifacts/ios
      - uses: actions/upload-artifact@v4
        with:
          name: MegaNugget-unsigned-device
          path: artifacts/ios/
          if-no-files-found: error
          retention-days: 7
