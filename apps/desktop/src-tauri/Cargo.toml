[package]
name = "meganugget-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
device-manager = { path = "../../../crates/device-manager" }
compatibility = { path = "../../../crates/compatibility" }
diagnostics = { path = "../../../crates/diagnostics" }
app-installer = { path = "../../../crates/app-installer" }
apple-signing = { path = "../../../crates/apple-signing" }
customization = { path = "../../../crates/customization" }
zeroize = "1"
tokio = { version = "1", features = ["time"] }
futures-util = "0.3"
rfd = "0.15"
