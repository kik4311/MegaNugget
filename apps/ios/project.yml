name: MegaNugget
options:
  bundleIdPrefix: org.meganugget
  deploymentTarget:
    iOS: '15.0'
packages:
  MegaNuggetCore:
    path: .
targets:
  MegaNugget:
    type: application
    platform: iOS
    sources:
      - Sources/App
    dependencies:
      - package: MegaNuggetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.meganugget.ios
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MegaNugget
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  MegaNugget:
    build:
      targets:
        MegaNugget: all
