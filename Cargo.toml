[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/device-manager", "crates/compatibility", "crates/diagnostics", "crates/app-installer", "crates/apple-signing"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
tempfile = "3"
